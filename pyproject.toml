[project]
name = "lean-browser"
version = "0.1.0"
description = "A token-lean browser for AI agents, built on Obscura with Chromium fallback"
license = "Apache-2.0"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "playwright==1.64.1",
  "anthropic==2.3.0",
  "mcp==2.3.0",
]

[project.optional-dependencies]
dev = ["pytest==8.4.2", "pytest-asyncio==1.2.0", "tiktoken==0.12.0"]

[project.scripts]
leanb = "lean_browser.cli:main"
leanb-eval = "evals.runner:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["lean_browser*", "evals*"]

[tool.setuptools.package-data]
lean_browser = ["*.js"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
