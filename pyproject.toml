[project]
name = "lean-agent-browser"
version = "0.3.0"
description = "A token-lean browser for AI agents, built on Obscura with Chromium fallback"
license = "Apache-2.0"
readme = "README.md"
authors = [{ name = "Sanchit Thareja" }]
keywords = ["browser", "ai-agents", "mcp", "playwright", "obscura", "llm"]
classifiers = [
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3",
  "Topic :: Internet :: WWW/HTTP :: Browsers",
]
requires-python = ">=3.12"
dependencies = [
  "playwright==1.64.1",
  "mcp==2.3.0",
]

[project.urls]
Repository = "https://github.com/Sanchit-hub/lean-agent-browser"

[project.optional-dependencies]
eval = ["anthropic==2.3.0"]
dev = ["anthropic==2.3.0", "pytest==8.4.2", "pytest-asyncio==1.2.0", "tiktoken==0.12.0"]

[project.scripts]
leanb = "lean_browser.cli:main"
leanb-eval = "evals.runner:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["lean_browser*", "evals*"]

[tool.setuptools.package-data]
lean_browser = ["*.js", "*.txt"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
