[project]
name = "lean-agent-browser"
dynamic = ["version"]
description = "A token-lean browser for AI agents, built on Obscura with Chromium fallback"
license = "Apache-2.0"
readme = "README.md"
authors = [{ name = "Sanchit Thareja" }]
keywords = ["browser", "ai-agents", "mcp", "playwright", "obscura", "llm"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Topic :: Internet :: WWW/HTTP :: Browsers",
  "Topic :: Software Development :: Testing",
]
requires-python = ">=3.12"
dependencies = [
  "playwright==1.64.1",
  "mcp==2.3.0",
]

[project.urls]
Repository = "https://github.com/Sanchit-hub/lean-agent-browser"
Documentation = "https://github.com/Sanchit-hub/lean-agent-browser#readme"
Issues = "https://github.com/Sanchit-hub/lean-agent-browser/issues"
Changelog = "https://github.com/Sanchit-hub/lean-agent-browser/blob/main/CHANGELOG.md"

[project.optional-dependencies]
eval = ["anthropic==2.3.0"]
dev = ["anthropic==2.3.0", "pytest==8.4.2", "pytest-asyncio==1.2.0", "tiktoken==0.12.0"]

[project.scripts]
leanb = "lean_browser.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
version = { attr = "lean_browser.__version__" }   # one source of truth: lean_browser/__init__.py

[tool.setuptools.packages.find]
include = ["lean_browser*"]   # evals/ runs from a source checkout only (python -m evals.claude_driver)

[tool.setuptools.package-data]
lean_browser = ["*.js", "*.txt"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
