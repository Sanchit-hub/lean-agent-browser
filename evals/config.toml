# Eval harness settings. Change the model here, not in code.
model = "claude-sonnet-5-5"
effort = "medium"          # output_config.effort
max_tokens = 8000          # per agent response
max_steps = 25             # per task
runs = 3                   # repetitions per (task, mode)

# Prices in USD per million tokens, for the cost estimate only.
[price]
input = 2.00
output = 10.00
cache_write_multiplier = 1.25
cache_read_multiplier = 0.10

# Rough expected input tokens per task, used only to estimate cost before a run.
[estimate_tokens_per_task]
screenshot = 60000
html = 80000
aria = 40000
"playwright-mcp" = 35000
lean = 10000
"lean-escalate" = 12000
