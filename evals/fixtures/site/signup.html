<!doctype html><html><head><meta charset="utf-8"><title>Sign up</title><link rel="stylesheet" href="/style.css"></head><body><!--NAV-->
<main><h1>Create your account</h1>
<form id="f" method="post" action="/api/signup" novalidate>
<label>Username <input name="username" id="u" required></label>
<label>Email <input name="email" id="e" type="email" required></label><div class="err" id="e-err" role="alert"></div>
<label>Password <input name="password" id="p" type="password" required></label><div class="err" id="p-err" role="alert"></div>
<label>Confirm password <input name="confirm" id="c" type="password" required></label><div class="err" id="c-err" role="alert"></div>
<label><input type="checkbox" name="terms" id="t"> I accept the terms</label><div class="err" id="t-err" role="alert"></div>
<button type="submit">Create account</button>
</form></main><!--FOOTER-->
<script>
document.getElementById('f').addEventListener('submit', e => {
  const v = id => document.getElementById(id);
  let ok = true;
  const set = (id, msg) => { v(id).textContent = msg; if (msg) ok = false; };
  set('e-err', /^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v('e').value) ? '' : 'Enter a valid email address');
  set('p-err', v('p').value.length >= 10 ? '' : 'Password must be at least 10 characters');
  set('c-err', v('c').value === v('p').value ? '' : 'Passwords do not match');
  set('t-err', v('t').checked ? '' : 'You must accept the terms');
  if (!ok) e.preventDefault();
});
</script></body></html>
