<!doctype html><html><head><meta charset="utf-8"><title>Custom controls</title>
<style>.toggle{opacity:0;width:30px;height:30px;position:absolute}.box{display:inline-block;width:30px;height:30px;border:1px solid #333}
li{position:relative;padding-left:40px;list-style:none}</style></head><body>
<h1>Chores</h1>
<ul>
  <li><input class="toggle" type="checkbox" id="c1"><label for="c1">Water plants</label></li>
  <li><input class="toggle" type="checkbox"><label>Feed cat</label></li>
</ul>
<label><input class="toggle" type="radio" name="size" value="s">Small</label>
<div style="opacity:0"><input type="checkbox" aria-label="Trap checkbox"></div>
</body></html>
