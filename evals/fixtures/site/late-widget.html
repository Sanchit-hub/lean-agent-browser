<!doctype html><html><head><meta charset="utf-8"><title>Late widget</title></head><body>
<h1>Editor</h1>
<div id="editor"></div>
<iframe id="ed_ifr" srcdoc="<p>frame</p>" style="visibility:hidden;width:300px;height:80px"></iframe>
<script>
  // like TinyMCE: after load, add the plugin script; the frame stays visibility:hidden until a script inside it runs
  addEventListener('load', () => setTimeout(() => {
    const s = document.createElement('script'); s.src = '/slow-plugin.js?delay=1'; document.head.appendChild(s);
  }, 50));
</script>
</body></html>
