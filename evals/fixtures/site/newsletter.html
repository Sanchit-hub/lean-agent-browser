<!doctype html><html><head><meta charset="utf-8"><title>Newsletter</title><link rel="stylesheet" href="/style.css"></head><body><!--NAV-->
<main><h1>Subscribe to our newsletter</h1>
<form method="post" action="/api/submit/newsletter">
<label>Email <input name="email" type="email" required></label>
<label>Frequency <select name="freq"><option>weekly</option><option>monthly</option></select></label>
<button type="submit">Subscribe</button></form></main><!--FOOTER-->
<div class="overlay" id="consent"><div class="modal" role="dialog" aria-label="Cookie consent">
<p>We use cookies to improve your experience. Choose an option to continue.</p>
<button id="accept">Accept all</button> <button id="reject">Reject non-essential</button></div></div>
<script>
const pick = v => { document.cookie = 'consent=' + v + '; path=/'; document.getElementById('consent').remove(); };
document.getElementById('accept').onclick = () => pick('accepted');
document.getElementById('reject').onclick = () => pick('rejected');
</script></body></html>
