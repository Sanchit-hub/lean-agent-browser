<!doctype html><html><head><meta charset="utf-8"><title>Support chat</title></head><body>
<main><h1>Support chat</h1><button id="go" type="button">Start chat</button><p id="s" role="status"></p></main>
<script>
document.getElementById('go').onclick = () => {
  const ws = new WebSocket('ws://' + location.host + '/ws');
  ws.onopen = () => { document.getElementById('s').textContent = 'Chat connected'; };
  ws.onclose = () => { document.getElementById('s').textContent = 'Chat unavailable'; };
};
</script></body></html>
