<!doctype html><html><head><meta charset="utf-8"><title>Discussion</title><link rel="stylesheet" href="/style.css"></head><body><!--NAV-->
<main><h1>Release notes discussion</h1><p>v2.3 shipped dark mode and faster search.</p>
<div>Your comment</div><div class="editor" id="ed" contenteditable="true" role="textbox" aria-label="Comment" aria-multiline="true"></div>
<button id="post">Post comment</button><p id="m" role="status"></p></main><!--FOOTER-->
<script>
document.getElementById('post').onclick = async () => {
  const text = document.getElementById('ed').innerText.trim();
  if (!text) { document.getElementById('m').textContent = 'Comment cannot be empty'; return; }
  await fetch('/api/submit/editor', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({text})});
  document.getElementById('m').textContent = 'Comment posted';
};
</script></body></html>
