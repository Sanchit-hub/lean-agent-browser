<!doctype html><html><head><meta charset="utf-8"><title>Live prices</title></head><body>
<main><h1>Live prices</h1><p id="s">connecting…</p></main>
<script>
const ws = new WebSocket('ws://' + location.host + '/ws');
ws.onopen = () => { document.getElementById('s').textContent = 'connected'; };
ws.onerror = () => { document.getElementById('s').textContent = 'offline'; };
</script></body></html>
