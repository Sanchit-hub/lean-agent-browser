<!doctype html><html><head><meta charset="utf-8"><title>Shipping — step 2 of 3</title><link rel="stylesheet" href="/style.css"></head><body><!--NAV-->
<main><h1>Step 2 of 3: Address</h1>
<label>City <select id="city"><option value="">Choose…</option><option>Delhi</option><option>Mumbai</option><option>Bengaluru</option><option>Pune</option></select></label>
<label>PIN code <input id="pin"></label><div class="err" id="pin-err" role="alert"></div>
<button id="back">Back</button> <button id="next">Next</button></main><!--FOOTER-->
<script>
const s = JSON.parse(sessionStorage.wiz || '{}');
document.getElementById('back').onclick = () => location.href = '/wizard1.html';
document.getElementById('next').onclick = () => {
  const pin = document.getElementById('pin').value;
  if (!/^\d{6}$/.test(pin)) { document.getElementById('pin-err').textContent = 'PIN code must be 6 digits'; return; }
  s.city = document.getElementById('city').value; s.pin = pin;
  sessionStorage.wiz = JSON.stringify(s); location.href = '/wizard3.html';
};
</script></body></html>
